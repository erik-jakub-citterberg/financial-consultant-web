# Netlify builds the real site from master.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Pre-launch: PREVIEW=1 adds <meta name="robots" content="noindex"> to every page.
  # LAUNCH: delete this line and the [[headers]] block below.
  PREVIEW = "1"

# Pre-launch: keep the Netlify URL out of Google. LAUNCH: delete this block.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
